<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ward-wise Voter Analysis</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{--primary:#4361ee;}
body{
  font-family:Segoe UI, sans-serif;
  background:#eef2fb;
  margin:0;
  padding:20px;
}
.container{
  max-width:850px;
  margin:auto;
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  overflow:hidden;
}
.header{
  background:var(--primary);
  color:#fff;
  padding:22px;
  text-align:center;
  position:relative;
}
.lang-toggle{
  position:absolute;
  right:20px;
  top:20px;
  background:rgba(255,255,255,.2);
  border:none;
  color:#fff;
  padding:6px 14px;
  border-radius:20px;
  cursor:pointer;
}
.content{padding:25px}
label{font-weight:600;display:block;margin-top:12px}
select,button,input{
  padding:10px;
  font-size:15px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:5px;
}
button{
  background:var(--primary);
  color:#fff;
  border:none;
  cursor:pointer;
}
.info-box{
  background:#eef4ff;
  padding:12px;
  border-left:4px solid var(--primary);
  margin-top:15px;
  border-radius:8px;
}
.chart-box{
  max-width:300px;
  margin:20px auto;
  display:none;
}
.result{
  margin-top:20px;
  display:none;
}
.voter-list{
  background:#fff;
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
  max-height:250px;
  overflow:auto;
}
.hidden{display:none}
</style>
</head>

<body>

<!-- 🔐 PASSWORD -->
<div class="container" id="loginBox">
  <div class="header"><h2>Secure Login</h2></div>
  <div class="content" style="text-align:center">
    <input type="password" id="password" placeholder="Enter Password">
    <br><br>
    <button onclick="checkPassword()">Login</button>
  </div>
</div>

<!-- 🔓 MAIN APP -->
<div class="container hidden" id="app">
  <div class="header">
    <h2 id="title">Ward-wise Voter Analysis</h2>
    <button class="lang-toggle" id="langToggle">हिंदी</button>
  </div>

  <div class="content">
    <label id="lblWard">Select Ward</label>
    <select id="wardSelect">
      <option value="">-- Select Ward --</option>
    </select>

    <div class="info-box hidden" id="wardInfo">
      <b>Total Houses:</b> <span id="houseCount"></span><br>
      <b>Total Voters:</b> <span id="wardVoters"></span>
    </div>

    <div class="chart-box" id="chartBox">
      <canvas id="pieChart"></canvas>
    </div>

    <label id="lblHouse">Select House</label>
    <select id="houseSelect" disabled>
      <option value="">-- Select House --</option>
    </select>

    <div class="info-box hidden" id="houseInfo"></div>

    <button onclick="showVoters()">
      <i class="fa fa-users"></i> <span id="btnText">Show Voters</span>
    </button>

    <div class="result" id="result">
      <h3 id="resultHeader"></h3>
      <p><b>Total Voters:</b> <span id="totalVoters"></span></p>
      <div class="voter-list" id="voterList"></div>
    </div>
  </div>
</div>

<script>
let allData=[],currentLang='en',chart=null;

/* PASSWORD */
function checkPassword(){
  if(password.value==="1857"){
    loginBox.classList.add('hidden');
    app.classList.remove('hidden');
  } else alert("Wrong Password");
}

/* LOAD DATA */
fetch('voters.json')
.then(r=>r.json())
.then(d=>{
  allData=d;
  [...new Set(d.map(v=>v.Ward))].sort((a,b)=>a-b)
  .forEach(w=>wardSelect.innerHTML+=`<option value="${w}">Ward ${w}</option>`);
});

/* LANGUAGE */
langToggle.onclick=()=>{
  currentLang=currentLang==='en'?'hi':'en';
  langToggle.textContent=currentLang==='en'?'हिंदी':'English';
  title.textContent=currentLang==='hi'
    ?'वार्ड-वार मतदाता विश्लेषण'
    :'Ward-wise Voter Analysis';
  lblWard.textContent=currentLang==='hi'?'वार्ड चुनें':'Select Ward';
  lblHouse.textContent=currentLang==='hi'?'मकान चुनें':'Select House';
  btnText.textContent=currentLang==='hi'?'मतदाता देखें':'Show Voters';
};

/* WARD CHANGE */
wardSelect.onchange=()=>{
  let w=+wardSelect.value;
  if(!w) return;

  let wd=allData.filter(v=>v.Ward===w);
  let houses=[...new Set(wd.map(v=>v.H_No))];

  houseCount.textContent=houses.length;
  wardVoters.textContent=wd.length;
  wardInfo.classList.remove('hidden');

  houseSelect.innerHTML='<option value="">-- Select House --</option>';
  houses.forEach(h=>{
    houseSelect.innerHTML+=`<option value="${h}">
      ${currentLang==='hi'?'मकान':'House'} ${h}
    </option>`;
  });
  houseSelect.disabled=false;

  drawChart(wd);
};

/* PIE CHART */
function drawChart(data){
  let map={};
  data.forEach(v=>map[v.H_No]=(map[v.H_No]||0)+1);

  if(chart) chart.destroy();
  chart=new Chart(pieChart,{
    type:'pie',
    data:{
      labels:Object.keys(map),
      datasets:[{data:Object.values(map)}]
    },
    options:{plugins:{legend:{position:'bottom'}}}
  });
  chartBox.style.display='block';
}

/* HOUSE CHANGE */
houseSelect.onchange=()=>{
  let w=+wardSelect.value,h=+houseSelect.value;
  let c=allData.filter(v=>v.Ward===w && v.H_No===h).length;
  houseInfo.textContent=`House ${h} → ${c} voters`;
  houseInfo.classList.remove('hidden');
};

/* SHOW VOTERS (OLD LOGIC – FIXED) */
function showVoters(){
  let w=+wardSelect.value,h=+houseSelect.value;
  let voters=allData.filter(v=>v.Ward===w && v.H_No===h);

  resultHeader.textContent=`Ward ${w}, House ${h}`;
  totalVoters.textContent=voters.length;
  voterList.innerHTML='';

  voters.forEach((v,i)=>{
    let name=currentLang==='hi'?v.Name_hi:v.Name_en;
    voterList.innerHTML+=`${i+1}. ${name}<br>`;
  });
  result.style.display='block';
}
</script>

</body>
</html>
